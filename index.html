<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vessel ETA Tracker — CSP Zeebrugge</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
      --text:#e6edf3;--muted:#8b949e;--accent:#388bfd;--green:#3fb950;
      --red:#f85149;--yellow:#d29922;--font:'Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

    /* Header */
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
    .brand{display:flex;align-items:center;gap:.75rem;}
    .brand-icon{font-size:1.5rem;}
    .brand h1{font-size:1rem;font-weight:700;}
    .brand p{color:var(--muted);font-size:.7rem;margin-top:1px;}
    .header-right{display:flex;align-items:center;gap:1.5rem;}
    .hkpi{text-align:center;}
    .hkpi-val{font-size:1.1rem;font-weight:700;color:var(--accent);}
    .hkpi-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
    .status-pill{display:flex;align-items:center;gap:.4rem;background:var(--surface2);border:1px solid var(--border);padding:.3rem .75rem;border-radius:20px;font-size:.75rem;}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
    .dot.live{background:var(--green);animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    /* Main */
    .main{display:grid;grid-template-columns:1fr 400px;flex:1;overflow:hidden;}

    /* Map */
    #map{background:#080c12;}
    .leaflet-container{background:#080c12!important;}

    /* Right panel */
    .right-panel{display:flex;flex-direction:column;border-left:1px solid var(--border);overflow:hidden;}

    /* Vessel list */
    .panel-section{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .section-header{padding:.6rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--surface);}
    .section-title{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
    .vessel-list{overflow-y:auto;flex:1;}
    .vessel-row{padding:.6rem 1rem;border-bottom:1px solid var(--surface2);cursor:pointer;}
    .vessel-row:hover{background:var(--surface2);}
    .vessel-row.selected{background:rgba(56,139,253,.08);border-left:2px solid var(--accent);}
    .vr-top{display:flex;align-items:center;gap:.5rem;margin-bottom:3px;}
    .vname{font-weight:600;font-size:.82rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .badge{padding:2px 7px;border-radius:10px;font-size:.65rem;font-weight:700;white-space:nowrap;}
    .b-ok{background:rgba(63,185,80,.15);color:var(--green);}
    .b-warn{background:rgba(210,153,34,.15);color:var(--yellow);}
    .b-late{background:rgba(248,81,73,.15);color:var(--red);}
    .b-grey{background:rgba(139,148,158,.1);color:var(--muted);}
    .vmeta{font-size:.68rem;color:var(--muted);display:flex;gap:.75rem;flex-wrap:wrap;}

    /* Chart */
    .chart-section{flex-shrink:0;border-top:1px solid var(--border);padding:.75rem 1rem;background:var(--surface);}
    .chart-section h3{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem;}

    /* Alert bar */
    #alert-bar{display:none;background:rgba(248,81,73,.1);border-bottom:1px solid var(--red);padding:.4rem 1.5rem;font-size:.78rem;color:var(--red);flex-shrink:0;}

    /* Tooltip */
    .vessel-tooltip{background:var(--surface)!important;border:1px solid var(--border)!important;color:var(--text)!important;font-family:var(--font)!important;font-size:11px!important;padding:6px 10px!important;border-radius:6px!important;box-shadow:0 4px 16px rgba(0,0,0,.5)!important;}

    /* Placeholder */
    .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:.5rem;font-size:.82rem;}
    .placeholder-icon{font-size:2rem;opacity:.3;}
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-icon">⚓</span>
    <div>
      <h1>CSP Zeebrugge — Vessel ETA Monitor</h1>
      <p>Live AIS · North Sea approach · Navis N4 schedule comparison</p>
    </div>
  </div>
  <div class="header-right">
    <div class="hkpi"><div class="hkpi-val" id="h-vessels">0</div><div class="hkpi-label">Vessels tracked</div></div>
    <div class="hkpi"><div class="hkpi-val" id="h-alerts">0</div><div class="hkpi-label">ETA alerts</div></div>
    <div class="hkpi"><div class="hkpi-val" id="h-msgs">0</div><div class="hkpi-label">AIS messages</div></div>
    <div class="status-pill">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </div>
</header>

<div id="alert-bar" id="alert-bar">⚠ <span id="alert-text"></span></div>

<div class="main">
  <div id="map"></div>
  <div class="right-panel">
    <div class="panel-section">
      <div class="section-header">
        <span class="section-title">Vessels — Zeebrugge approach</span>
        <span style="font-size:.7rem;color:var(--accent)" id="live-count">0 live</span>
      </div>
      <div class="vessel-list" id="vessel-list">
        <div class="placeholder">
          <span class="placeholder-icon">🚢</span>
          <span>Connecting to AIS feed...</span>
        </div>
      </div>
    </div>
    <div class="chart-section">
      <h3>ETA deviation — scheduled vs actual (minutes)</h3>
      <canvas id="etaChart" height="100"></canvas>
    </div>
  </div>
</div>

<script>
// ── CONFIG — set your aisstream.io API key here ──────────────────────
const AIS_API_KEY = '897a66335782442231c37a9761fcce9accd8f6f3';

// Bounding box: North Sea + English Channel approach to Zeebrugge
const BBOX = [[50.0, 1.0], [52.5, 5.0]];

// Zeebrugge terminal coordinates
const TERMINAL = { lat: 51.348, lon: 3.196 };

// Simulated N4 vessel schedule (in production: fetched from N4 REST API)
const N4_SCHEDULE = [
  { name: 'COSCO SHIPPING AQUARIUS', eta: hoursFromNow(-0.5), service: 'AEX', carrier: 'COSCO' },
  { name: 'OOCL HONG KONG',          eta: hoursFromNow(2),    service: 'EC2', carrier: 'OOCL'  },
  { name: 'MSC ALLEGRA',             eta: hoursFromNow(4.5),  service: 'AEX', carrier: 'MSC'   },
  { name: 'EVER GLORY',              eta: hoursFromNow(7),    service: 'FE4', carrier: 'EGLV'  },
  { name: 'CMA CGM MARCO POLO',      eta: hoursFromNow(11),   service: 'FAL', carrier: 'CMDU'  },
];

// ── State ────────────────────────────────────────────────────────────
let vessels = {}, markers = {}, selectedMmsi = null;
let etaHistory = [], etaChart = null, map = null;
let msgCount = 0, alertCount = 0;

// ── Map ──────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: false })
         .setView([51.2, 3.0], 8);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18, subdomains: 'abcd'
  }).addTo(map);

  // Terminal marker
  L.marker([TERMINAL.lat, TERMINAL.lon], {
    icon: L.divIcon({
      html: '<div style="background:#388bfd;color:white;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4)">⚓ CSP Zeebrugge</div>',
      iconAnchor: [65, 10], className: ''
    })
  }).addTo(map);

  // Approach zone
  L.rectangle(BBOX, { color:'#388bfd', weight:1, fillOpacity:0.03, dashArray:'5' }).addTo(map);

  // Scheduled vessels (ghost markers)
  N4_SCHEDULE.forEach(s => {
    L.circleMarker([51.0, 2.5 + Math.random() * 1.5], {
      radius: 5, color: '#8b949e', fillColor: '#8b949e',
      fillOpacity: 0.3, weight: 1, dashArray: '3'
    }).addTo(map).bindTooltip(`📋 Scheduled: ${s.name}<br>ETA: ${fmt(s.eta)} | ${s.service}`, {
      className: 'vessel-tooltip'
    });
  });
}

// ── AIS WebSocket ─────────────────────────────────────────────────────
function connect() {
  setStatus('connecting', 'Connecting...');
  const ws = new WebSocket('wss://stream.aisstream.io/v0/stream');

  ws.onopen = () => {
    ws.send(JSON.stringify({
      APIKey: AIS_API_KEY,
      BoundingBoxes: [BBOX],
      FilterMessageTypes: ['PositionReport', 'ShipStaticData']
    }));
    setStatus('live', 'Live — AIS feed active');
  };

  ws.onmessage = e => {
    msgCount++;
    document.getElementById('h-msgs').textContent = msgCount.toLocaleString();
    handleMsg(JSON.parse(e.data));
  };

  ws.onerror = () => setStatus('error', 'Connection error');
  ws.onclose = () => {
    setStatus('off', 'Disconnected — retrying...');
    setTimeout(connect, 5000); // auto-reconnect
  };
}

// ── Message handler ───────────────────────────────────────────────────
function handleMsg(msg) {
  const mmsi = String(msg.MetaData?.MMSI || '');
  const lat  = msg.MetaData?.latitude;
  const lon  = msg.MetaData?.longitude;
  if (!mmsi || !lat || !lon) return;

  const existing = vessels[mmsi] || {};

  if (msg.MessageType === 'PositionReport') {
    const p = msg.Message?.PositionReport || {};
    vessels[mmsi] = { ...existing, mmsi, lat, lon,
      sog: p.Sog || 0, cog: p.Cog || 0,
      name: existing.name || msg.MetaData?.ShipName?.trim() || mmsi,
      lastSeen: new Date()
    };
  }

  if (msg.MessageType === 'ShipStaticData') {
    const s = msg.Message?.ShipStaticData || {};
    vessels[mmsi] = { ...existing, mmsi, lat, lon,
      name: s.Name?.trim() || existing.name || mmsi,
      destination: s.Destination?.trim() || '',
      lastSeen: new Date()
    };
  }

  const v = vessels[mmsi];

  // ETA calculation
  if (v.sog > 0.5) {
    const dist = haversine(v.lat, v.lon, TERMINAL.lat, TERMINAL.lon);
    v.distKm = Math.round(dist);
    v.calcEta = new Date(Date.now() + (dist / (v.sog * 1.852)) * 3600000);

    // Match against N4 schedule
    const sched = N4_SCHEDULE.find(s =>
      v.name && (v.name.includes(s.name.split(' ')[0]) || s.name.includes(v.name.split(' ')[0]))
    );
    if (sched) {
      v.schedEta = sched.eta;
      v.service  = sched.service;
      v.devMin   = Math.round((v.calcEta - sched.eta) / 60000);
      if (Math.abs(v.devMin) > 120) {
        alertCount++;
        document.getElementById('h-alerts').textContent = alertCount;
        showAlert(`${v.name} — ETA deviation ${v.devMin > 0 ? '+' : ''}${v.devMin} min vs N4 schedule (${sched.service})`);
      }
      etaHistory.push({ t: new Date(), name: v.name, dev: v.devMin });
      if (etaHistory.length > 30) etaHistory.shift();
      updateChart();
    }
  }

  updateMarker(mmsi);
  renderList();
  document.getElementById('h-vessels').textContent = Object.keys(vessels).length;
  document.getElementById('live-count').textContent = Object.keys(vessels).length + ' live';
}

// ── Markers ───────────────────────────────────────────────────────────
function updateMarker(mmsi) {
  const v = vessels[mmsi];
  if (!v?.lat) return;
  const col = etaColor(v.devMin);
  const icon = L.divIcon({
    html: `<div style="position:relative">
      <div style="width:11px;height:11px;border-radius:50%;background:${col};border:2px solid rgba(255,255,255,.7);box-shadow:0 0 8px ${col}99;"></div>
    </div>`,
    iconAnchor: [5,5], className: ''
  });
  const tip = `<b>${v.name}</b><br>
    🚀 ${(v.sog||0).toFixed(1)} kn &nbsp;
    📍 ${v.distKm||'?'} km<br>
    🕐 ETA ${v.calcEta ? fmt(v.calcEta) : '—'}
    ${v.devMin !== undefined ? `<br>⚠ Dev: <b style="color:${col}">${v.devMin>0?'+':''}${v.devMin} min</b>` : ''}`;

  if (markers[mmsi]) {
    markers[mmsi].setLatLng([v.lat,v.lon]).setIcon(icon);
    markers[mmsi].setTooltipContent(tip);
  } else {
    markers[mmsi] = L.marker([v.lat,v.lon],{icon}).addTo(map)
      .bindTooltip(tip,{className:'vessel-tooltip',direction:'top',offset:[0,-8]})
      .on('click',()=>selectVessel(mmsi));
  }
}

// ── Vessel list ───────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('vessel-list');
  const arr = Object.values(vessels).filter(v=>v.lat).sort((a,b)=>(a.distKm||9999)-(b.distKm||9999));

  if (!arr.length) {
    list.innerHTML = '<div class="placeholder"><span class="placeholder-icon">📡</span><span>Scanning for vessels...</span></div>';
    return;
  }

  list.innerHTML = arr.map(v => {
    const dev = v.devMin;
    const badgeCls = dev===undefined ? 'b-grey' : Math.abs(dev)<30 ? 'b-ok' : Math.abs(dev)<120 ? 'b-warn' : 'b-late';
    const badgeTxt = dev===undefined ? 'No schedule' : `${dev>0?'+':''}${dev} min`;
    const eta = v.calcEta ? fmt(v.calcEta) : '—';
    const dest = v.destination ? ` → ${v.destination}` : '';

    return `<div class="vessel-row ${selectedMmsi===v.mmsi?'selected':''}" onclick="selectVessel('${v.mmsi}')">
      <div class="vr-top">
        <span class="vname" title="${v.name}">${v.name}</span>
        <span class="badge ${badgeCls}">${badgeTxt}</span>
      </div>
      <div class="vmeta">
        <span>⚡ ${(v.sog||0).toFixed(1)} kn</span>
        ${v.distKm ? `<span>📍 ${v.distKm} km</span>` : ''}
        <span>🕐 ${eta}</span>
        ${v.service ? `<span style="color:var(--accent)">● ${v.service}</span>` : ''}
        ${dest ? `<span>${dest}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function selectVessel(mmsi) {
  selectedMmsi = mmsi;
  const v = vessels[mmsi];
  if (v?.lat) { map.panTo([v.lat,v.lon]); map.setZoom(10); }
  renderList();
}

// ── Chart ─────────────────────────────────────────────────────────────
function initChart() {
  const ctx = document.getElementById('etaChart').getContext('2d');
  etaChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{
      data: [], borderColor: '#388bfd',
      backgroundColor: 'rgba(56,139,253,0.08)',
      fill: true, tension: 0.4, pointRadius: 3,
      pointBackgroundColor: '#388bfd', borderWidth: 1.5
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks:{color:'#8b949e',font:{size:9},maxTicksLimit:6}, grid:{color:'rgba(48,54,61,0.6)'} },
        y: { ticks:{color:'#8b949e',callback:v=>`${v>0?'+':''}${v}m`}, grid:{color:'rgba(48,54,61,0.6)'},
             suggestedMin:-60, suggestedMax:60 }
      }
    }
  });
}

function updateChart() {
  if (!etaChart || !etaHistory.length) return;
  etaChart.data.labels = etaHistory.map(p=>fmt(p.t));
  etaChart.data.datasets[0].data = etaHistory.map(p=>p.dev);
  etaChart.data.datasets[0].pointBackgroundColor = etaHistory.map(p=>etaColor(p.dev));
  etaChart.update('none');
}

// ── Helpers ───────────────────────────────────────────────────────────
function haversine(lat1,lon1,lat2,lon2){
  const R=6371,d2r=Math.PI/180;
  const dLat=(lat2-lat1)*d2r, dLon=(lon2-lon1)*d2r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function etaColor(dev){
  if(dev===undefined)return'#8b949e';
  return Math.abs(dev)<30?'#3fb950':Math.abs(dev)<120?'#d29922':'#f85149';
}
function fmt(d){ return d?.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'})||'—'; }
function hoursFromNow(h){ return new Date(Date.now()+h*3600000); }
function setStatus(state,text){
  document.getElementById('status-dot').className='dot'+(state==='live'?' live':'');
  document.getElementById('status-text').textContent=text;
}
function showAlert(msg){
  const bar=document.getElementById('alert-bar');
  bar.style.display='block';
  document.getElementById('alert-text').textContent=msg;
  setTimeout(()=>bar.style.display='none',8000);
}

// ── Boot ──────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  initMap();
  initChart();
  connect();
});
</script>
</body>
</html>
